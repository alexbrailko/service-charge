name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            cd /var/www/service-charge
            git pull
            npm ci
            npx prisma migrate deploy
            npm run build
            pm2 reload nextjs || pm2 start npm --name nextjs -- start
            pm2 save
